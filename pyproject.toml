[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-tools-launcher"
version = "1.0.0"
description = "A system-themed home-screen launcher for local Windows tools."
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
build = ["pyinstaller>=6.21,<7"]

[project.gui-scripts]
python-tools = "python_tools_launcher.app:main"

[tool.setuptools.packages.find]
where = ["src"]
